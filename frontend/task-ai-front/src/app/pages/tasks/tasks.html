<div class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-white p-6">
  
  <div class="max-w-7xl mx-auto">

    <!-- HEADER -->
    <div class="text-center mb-10">
      <h1 class="text-4xl font-bold tracking-tight">Task AI CRUD</h1>
      <p class="text-slate-400 mt-2">
        Gerencie tarefas e use IA para automatizar sua produtividade 🚀
      </p>
    </div>

    <div class="grid lg:grid-cols-3 gap-6">

      <!-- FORM -->
      <div class="lg:col-span-1 bg-white/5 backdrop-blur rounded-2xl p-6 border border-white/10 shadow-xl">
        
        <h2 class="text-xl font-semibold mb-4">Nova tarefa</h2>

        <div class="space-y-4">

          <input
            [(ngModel)]="title"
            placeholder="Título da tarefa"
            class="w-full p-3 rounded-xl bg-slate-900 border border-white/10 focus:ring-2 focus:ring-violet-500 outline-none"
          />

          <textarea
            [(ngModel)]="description"
            placeholder="Descrição"
            rows="4"
            class="w-full p-3 rounded-xl bg-slate-900 border border-white/10 focus:ring-2 focus:ring-violet-500 outline-none"
          ></textarea>

          <select
            [(ngModel)]="priority"
            class="w-full p-3 rounded-xl bg-slate-900 border border-white/10 focus:ring-2 focus:ring-violet-500 outline-none"
          >
            <option value="baixa">Baixa</option>
            <option value="media">Média</option>
            <option value="alta">Alta</option>
          </select>

          <!-- IA -->
          <button
            (click)="generateAI()"
            class="w-full bg-violet-600 hover:bg-violet-500 transition p-3 rounded-xl font-medium"
          >
            ✨ Gerar com IA
          </button>

          <button
            (click)="createTask()"
            class="w-full bg-emerald-600 hover:bg-emerald-500 transition p-3 rounded-xl font-medium"
          >
            Criar tarefa
          </button>

          <!-- Resultado IA -->
          <div *ngIf="aiResult" class="mt-4 p-3 bg-slate-900 rounded-xl text-sm border border-white/10">
            <p class="font-semibold mb-2">Sugestão de subtarefas:</p>
            <pre class="whitespace-pre-wrap text-slate-300">{{ aiResult }}</pre>
          </div>

        </div>
      </div>

      <!-- LISTA -->
      <div class="lg:col-span-2 space-y-4">

        <div
          *ngFor="let task of tasks"
          class="bg-white/5 border border-white/10 rounded-2xl p-5 shadow-lg hover:scale-[1.01] transition"
        >

          <div class="flex justify-between items-start gap-4">

            <div>
              <h3 class="text-lg font-semibold">
                {{ task.title }}
              </h3>

              <p class="text-slate-400 mt-1 text-sm">
                {{ task.description }}
              </p>

              <div class="flex gap-3 mt-3 text-xs">

                <span class="px-2 py-1 rounded bg-slate-800">
                  {{ task.status }}
                </span>

                <span
                  class="px-2 py-1 rounded"
                  [ngClass]="{
                    'bg-green-600': task.priority === 'alta',
                    'bg-yellow-600': task.priority === 'media',
                    'bg-gray-600': task.priority === 'baixa'
                  }"
                >
                  {{ task.priority }}
                </span>

              </div>
            </div>

            <!-- AÇÕES -->
            <div class="flex flex-col gap-2">

              <button
                (click)="completeTask(task.id)"
                class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-2 rounded"
              >
                Concluir
              </button>

              <button
                (click)="deleteTask(task.id)"
                class="bg-red-600 hover:bg-red-500 text-xs px-3 py-2 rounded"
              >
                Excluir
              </button>

            </div>

          </div>

        </div>

        <!-- EMPTY STATE -->
        <div *ngIf="tasks.length === 0" class="text-center text-slate-500 mt-10">
          Nenhuma tarefa criada ainda.
        </div>

      </div>

    </div>

  </div>
</div>
